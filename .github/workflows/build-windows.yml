name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Export YOLOv8n to ONNX
        run: |
          pip install ultralytics onnx
          python tools/export_model.py

      - name: Build exe
        run: pyinstaller store_counter.spec --noconfirm

      - name: Add model + helper scripts
        shell: pwsh
        run: |
          Copy-Item models dist/StoreCounter/models -Recurse
          Copy-Item packaging/install_autostart.bat dist/StoreCounter/
          Compress-Archive -Path dist/StoreCounter -DestinationPath StoreCounter-win64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: StoreCounter-win64
          path: StoreCounter-win64.zip

      - name: Attach to GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: StoreCounter-win64.zip
